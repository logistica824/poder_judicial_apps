# horas-extra: Next.js 14 + Supabase self-hosted (db, auth con Google, rest,
# realtime, meta, studio y gateway Envoy) + cron que reemplaza a Vercel Cron.
# Basado en supabase/supabase docker/docker-compose.yml. Respecto del oficial:
#   - sin container_name; realtime conserva su hostname por alias de red
#     (realtime deduce el tenant "realtime-dev" del subdominio)
#   - sin storage, functions, imgproxy, supavisor ni analytics
#
# Stack de Portainer desde Git, en la raíz del repo de la app (lo copia
# procom-migracion-pj/scripts/armar-repo.sh):
#   nombre: pj-horas-test (rama testing) | pj-horas-prod (rama main)
#   variables: /srv/pj/env/horas-extra-<entorno>.env (Advanced mode)
# Portainer CE no monta archivos con ruta relativa: configs dentro de las
# imágenes (deploy/db, deploy/envoy), datos en /srv/pj/datos/<entorno>/horas.
# Testing y producción conviven: todo nombre global lleva ${ENTORNO}.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
    image: pj/horas-web:${ENTORNO:?falta ENTORNO (test o prod)}
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    environment:
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
      # Sólo servidor: cliente admin (src/lib/supabase/admin.ts) y cron.
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # Notificaciones por mail (src/lib/mail/enviar.ts).
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - /srv/pj/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      api-gw:
        condition: service_healthy
    networks: [default, edge]
    # El cron lo dispara el contenedor interno: /api/cron/ no se publica.
    labels:
      - traefik.enable=true
      - traefik.http.services.horas-web-${ENTORNO}.loadbalancer.server.port=3000
      - traefik.http.routers.horas-web-${ENTORNO}.rule=Host(`${WEB_HOST:?falta WEB_HOST}`)
      - traefik.http.routers.horas-web-${ENTORNO}.service=horas-web-${ENTORNO}
      - traefik.http.routers.horas-web-${ENTORNO}-bloqueo.rule=Host(`${WEB_HOST}`) && (PathPrefix(`/_next/image`) || PathPrefix(`/api/cron/`))
      - traefik.http.routers.horas-web-${ENTORNO}-bloqueo.middlewares=bloqueado@file
      - traefik.http.routers.horas-web-${ENTORNO}-bloqueo.service=horas-web-${ENTORNO}

  # Reemplaza vercel.json "crons": mismo horario, 0 23 * * 0 en UTC
  # (domingo 20:00 de Argentina). El contenedor corre en UTC a propósito.
  # crond de busybox no hereda el entorno: se escribe el crontab con los
  # valores ya resueltos. Script inline ($$ = $ para el shell) porque Portainer
  # CE no monta archivos relativos. Salida del job: logs del contenedor.
  cron:
    image: curlimages/curl:8.11.1
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        : "$${CRON_SECRET:?falta CRON_SECRET}"
        printf '%s curl -sS --max-time 300 -H "Authorization: Bearer %s" "%s" > /proc/1/fd/1 2>&1; echo " <- recordatorio-semanal $$(date -u)" > /proc/1/fd/1\n' \
          "$$CRON_SCHEDULE" "$$CRON_SECRET" "$$CRON_URL" > /etc/crontabs/root
        chmod 600 /etc/crontabs/root
        echo "cron: '$$CRON_SCHEDULE' (UTC) -> $$CRON_URL"
        exec crond -f -l 8
    restart: unless-stopped
    logging: *logging
    environment:
      CRON_SECRET: ${CRON_SECRET}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 23 * * 0}
      CRON_URL: http://web:3000/api/cron/recordatorio-semanal
    depends_on:
      - web

  studio:
    image: supabase/studio:2026.10.12-sha-3699278
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      DEFAULT_ORGANIZATION_NAME: Poder Judicial
      DEFAULT_PROJECT_NAME: horas-extra (${ENTORNO})
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - /srv/pj/datos/${ENTORNO}/horas/snippets:/app/snippets

  api-gw:
    build: ./deploy/envoy
    image: pj/horas-envoy:${ENTORNO}
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      studio:
        condition: service_healthy
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    networks:
      default:
        aliases: [envoy, kong]
      edge:
    # La API va para todos; el resto (Studio en "/") sólo desde ADMIN_CIDR.
    # Traefik prueba primero la regla más larga: la de la API.
    labels:
      - traefik.enable=true
      - traefik.http.services.horas-api-${ENTORNO}.loadbalancer.server.port=8000
      - traefik.http.routers.horas-api-${ENTORNO}.rule=Host(`${API_HOST:?falta API_HOST}`) && (PathPrefix(`/auth/v1/`) || PathPrefix(`/rest/v1/`) || PathPrefix(`/realtime/v1/`) || PathPrefix(`/graphql/v1`))
      - traefik.http.routers.horas-api-${ENTORNO}.service=horas-api-${ENTORNO}
      - traefik.http.routers.horas-studio-${ENTORNO}.rule=Host(`${API_HOST}`)
      - traefik.http.routers.horas-studio-${ENTORNO}.middlewares=solo-admin@file
      - traefik.http.routers.horas-studio-${ENTORNO}.service=horas-api-${ENTORNO}

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      # La app redirige a <origin>/auth/callback (boton-google.tsx).
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      # Signup abierto como en Cloud: el primer login con Google crea el usuario;
      # el acceso lo decide la whitelist (allowed_emails + trigger + middleware).
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      # Sólo Google.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET}
      # Debe estar cargado tal cual en Google Cloud Console > Authorized redirect URIs.
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  realtime:
    image: supabase/realtime:v2.143.3
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    networks:
      default:
        aliases: [realtime-dev.supabase-realtime]

  meta:
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  db:
    build:
      context: ./deploy/db
      target: completa
    image: pj/horas-db:${ENTORNO}
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    volumes:
      - /srv/pj/datos/${ENTORNO}/horas/db:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      # La primera inicialización (initdb + migraciones de la imagen) tarda más.
      start_period: 60s
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_EXP: ${JWT_EXPIRY}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

networks:
  edge:
    external: true

volumes:
  db-config:
