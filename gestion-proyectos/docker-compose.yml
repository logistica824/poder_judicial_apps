# gestion-proyectos: Next.js 16 + Supabase self-hosted (db, auth, rest, storage,
# meta, studio y gateway Envoy). Stack de Portainer desde Git, en la raíz del
# repo de la app (lo copia procom-migracion-pj/scripts/armar-repo.sh).
#
#   Portainer > Stacks > Add stack > Repository
#     nombre: pj-gestion-test (rama testing) | pj-gestion-prod (rama main)
#     compose path: docker-compose.yml
#     variables: /srv/pj/env/gestion-proyectos-<entorno>.env (Advanced mode)
#
# Portainer CE no monta archivos con ruta relativa: las configs van dentro de
# las imágenes (deploy/db, deploy/envoy) y los datos en rutas absolutas
# /srv/pj/datos/<entorno>/gestion. Testing y producción conviven en el mismo
# host: todo nombre global (routers de Traefik, imágenes) lleva ${ENTORNO}.
# Basado en supabase/supabase docker/docker-compose.yml; sin realtime,
# functions, imgproxy, supavisor ni analytics (la app no los usa).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    image: pj/gestion-web:${ENTORNO:?falta ENTORNO (test o prod)}
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    environment:
      # Server Components llaman a la URL pública: Node tiene que confiar en la CA interna.
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    volumes:
      - /srv/pj/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      api-gw:
        condition: service_healthy
    networks: [default, edge]
    labels:
      - traefik.enable=true
      - traefik.http.services.gestion-web-${ENTORNO}.loadbalancer.server.port=3000
      - traefik.http.routers.gestion-web-${ENTORNO}.rule=Host(`${WEB_HOST:?falta WEB_HOST}`)
      - traefik.http.routers.gestion-web-${ENTORNO}.service=gestion-web-${ENTORNO}
      # /_next/image: advisories críticas en Next 16 y la app no lo usa.
      - traefik.http.routers.gestion-web-${ENTORNO}-bloqueo.rule=Host(`${WEB_HOST}`) && PathPrefix(`/_next/image`)
      - traefik.http.routers.gestion-web-${ENTORNO}-bloqueo.middlewares=bloqueado@file
      - traefik.http.routers.gestion-web-${ENTORNO}-bloqueo.service=gestion-web-${ENTORNO}

  studio:
    image: supabase/studio:2026.10.12-sha-3699278
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      DEFAULT_ORGANIZATION_NAME: Poder Judicial
      DEFAULT_PROJECT_NAME: gestion-proyectos (${ENTORNO})
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - /srv/pj/datos/${ENTORNO}/gestion/snippets:/app/snippets

  api-gw:
    build: ./deploy/envoy
    image: pj/gestion-envoy:${ENTORNO}
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      studio:
        condition: service_healthy
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    networks:
      default:
        aliases: [envoy, kong]
      edge:
    # La API va para todos; el resto (Studio en "/") sólo desde ADMIN_CIDR.
    # Traefik prueba primero la regla más larga: la de la API.
    labels:
      - traefik.enable=true
      - traefik.http.services.gestion-api-${ENTORNO}.loadbalancer.server.port=8000
      - traefik.http.routers.gestion-api-${ENTORNO}.rule=Host(`${API_HOST:?falta API_HOST}`) && (PathPrefix(`/auth/v1/`) || PathPrefix(`/rest/v1/`) || PathPrefix(`/storage/v1/`) || PathPrefix(`/graphql/v1`))
      - traefik.http.routers.gestion-api-${ENTORNO}.service=gestion-api-${ENTORNO}
      - traefik.http.routers.gestion-studio-${ENTORNO}.rule=Host(`${API_HOST}`)
      - traefik.http.routers.gestion-studio-${ENTORNO}.middlewares=solo-admin@file
      - traefik.http.routers.gestion-studio-${ENTORNO}.service=gestion-api-${ENTORNO}

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      # Alta de usuarios sólo por admin (scripts/crear-usuarios.ts con service_role).
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      # Login con email + contraseña (necesita el provider email habilitado).
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      # Igual que en Cloud (config.toml: enable_confirmations = false).
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 6
      # SMTP opcional (recuperación de contraseña). Relay del PJ.
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  storage:
    image: supabase/storage-api:v1.81.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      # Techo global; cada bucket tiene el suyo (planos 20 MB, evidencias 10 MB).
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      # La app no usa transformaciones de imagen (se quitó imgproxy).
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - /srv/pj/datos/${ENTORNO}/gestion/storage:/var/lib/storage

  meta:
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  db:
    build:
      context: ./deploy/db
      target: completa
    image: pj/gestion-db:${ENTORNO}
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    volumes:
      - /srv/pj/datos/${ENTORNO}/gestion/db:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      # La primera inicialización (initdb + migraciones de la imagen) tarda más.
      start_period: 60s
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_EXP: ${JWT_EXPIRY}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

networks:
  edge:
    external: true

volumes:
  db-config:
