# bocas: Next.js 16 client-side. El navegador llama directo a PostgREST con
# supabase-js (anon key), así que no hace falta el resto de Supabase:
# Postgres (imagen supabase/postgres, trae los roles anon/authenticator) + PostgREST.
# Traefik publica PostgREST en https://<API_HOST>/rest/v1.
#
# Stack de Portainer desde Git, en la raíz del repo de la app (lo copia
# procom-migracion-pj/scripts/armar-repo.sh):
#   nombre: pj-bocas-test (rama testing) | pj-bocas-prod (rama main)
#   variables: /srv/pj/env/bocas-<entorno>.env (Advanced mode)
# Portainer CE no monta archivos con ruta relativa: los SQL de init van dentro
# de la imagen (deploy/db) y los datos en /srv/pj/datos/<entorno>/bocas.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    image: pj/bocas-web:${ENTORNO:?falta ENTORNO (test o prod)}
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.services.bocas-web-${ENTORNO}.loadbalancer.server.port=3000
      - traefik.http.routers.bocas-web-${ENTORNO}.rule=Host(`${WEB_HOST:?falta WEB_HOST}`)
      - traefik.http.routers.bocas-web-${ENTORNO}.service=bocas-web-${ENTORNO}
      - traefik.http.routers.bocas-web-${ENTORNO}-bloqueo.rule=Host(`${WEB_HOST}`) && PathPrefix(`/_next/image`)
      - traefik.http.routers.bocas-web-${ENTORNO}-bloqueo.middlewares=bloqueado@file
      - traefik.http.routers.bocas-web-${ENTORNO}-bloqueo.service=bocas-web-${ENTORNO}

  # Nombre único a propósito: este servicio está en la red compartida "edge" y
  # Docker publica ahí el nombre del servicio. Si se llamara "rest", los Envoy
  # de gestion/horas (también en "edge") resolverían "rest" a este PostgREST.
  bocas-rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 10000
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    command: ["postgrest"]
    networks: [default, edge]
    # supabase-js del navegador llama a <url>/rest/v1/<tabla>; PostgREST sirve en /.
    # Fuera de /rest/v1 no hay ruta: 404.
    labels:
      - traefik.enable=true
      - traefik.http.services.bocas-rest-${ENTORNO}.loadbalancer.server.port=3000
      - traefik.http.routers.bocas-rest-${ENTORNO}.rule=Host(`${API_HOST:?falta API_HOST}`) && PathPrefix(`/rest/v1/`)
      - traefik.http.routers.bocas-rest-${ENTORNO}.middlewares=bocas-rest-${ENTORNO}-prefijo
      - traefik.http.routers.bocas-rest-${ENTORNO}.service=bocas-rest-${ENTORNO}
      - traefik.http.middlewares.bocas-rest-${ENTORNO}-prefijo.stripprefix.prefixes=/rest/v1

  db:
    build:
      context: ./deploy/db
      target: minima
    image: pj/bocas-db:${ENTORNO}
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    volumes:
      - /srv/pj/datos/${ENTORNO}/bocas/db:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      # La primera inicialización (initdb + migraciones de la imagen) tarda más.
      start_period: 60s
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

networks:
  edge:
    external: true

volumes:
  db-config:
